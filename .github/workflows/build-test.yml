name: Build & Test

on:
  pull_request:
  push:
    branches: [main]

env:
  SOLUTION: Voidwell.Common.slnx
  CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Lint
        run: dotnet format ${{ env.SOLUTION }} --verify-no-changes --severity error --no-restore

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal
